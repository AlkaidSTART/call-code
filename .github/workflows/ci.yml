name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck session store
        run: bun x tsc -p packages/session-sqlite/tsconfig.json --noEmit

      - name: Typecheck client
        run: bun run typecheck:client

      - name: Run unit tests
        run: bun run test

      - name: Build agent-core
        run: bun run build:agent-core

      - name: Build client
        run: bun run build:client
